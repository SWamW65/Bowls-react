services:
  frontend:
    container_name: bowls-react_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8000/api
    command: npm run dev -- --host
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5173/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bowls-react_network

  db:
    image: postgres:13
    container_name: bowls-react_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: samlink
      POSTGRES_DB: bowls
    command: ["postgres", "-c", "listen_addresses=0.0.0.0"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bowls"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bowls-react_network

  pgadmin:
    build: ./pgadmin
    container_name: bowls-react_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bowls.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - bowls-react_network
    stdin_open: true
    tty: true

  backend:
    build: ./backend
    container_name: bowls-react_backend
    environment:
      DATABASE_URL: postgresql://postgres:samlink@db:5432/bowls
    volumes:
      - ./backend/app:/app
    ports:
      - "8000:8000"
    command: python -u main.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - bowls-react_network

  nginx:
    build: ./nginx
    container_name: bowls-react_nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - bowls-react_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  bowls-react_network:
    driver: bridge
